function fileClose46(){const o=document.getElementById('fv46');if(o){if(o._url)URL.revokeObjectURL(o._url);o.remove();document.documentElement.style.overflow='';document.removeEventListener('keydown',fileKey46)}}
function fileKey46(e){if(e.key==='Escape')fileClose46()}
async function fileView46(url,name,mime){fileClose46();const ov=document.createElement('div');ov.id='fv46';ov.setAttribute('role','dialog');ov.setAttribute('aria-modal','true');ov.setAttribute('aria-label',name);
 ov.innerHTML=`<div class="rep33-bar"><button type="button" class="btn ghost" data-f46="close">${ic('x')}Cerrar</button><span class="rep33-t">${esc(name)}</span></div><div class="rep33-sc"><div class="fv46-load"><span class="spin46"></span>Abriendo el archivo…</div></div>`;
 document.body.appendChild(ov);document.documentElement.style.overflow='hidden';document.addEventListener('keydown',fileKey46);
 ov.addEventListener('click',e=>{const b=e.target.closest('[data-f46]');if(!b)return;const a=b.dataset.f46;if(a==='close')fileClose46();else if(a==='share')fileShare46(ov)});
 let blob;try{if(url instanceof Blob)blob=url;else{const r=await fetch(url);if(!r.ok)throw 0;blob=await r.blob()}}catch(e){ov.querySelector('.rep33-sc').innerHTML=`<div class="fv46-card"><p>No se pudo abrir el archivo. Revisa tu conexión e inténtalo de nuevo.</p></div>`;return}
 if(!document.body.contains(ov))return;
 const type=mime||blob.type||'application/octet-stream';const file=new File([blob],name,{type});ov._file=file;const bu=URL.createObjectURL(file);ov._url=bu;
 const img=/^image\//.test(type)||/\.(png|jpe?g|gif|webp)$/i.test(name),pdf=/pdf/.test(type)||/\.pdf$/i.test(name),vid=/^video\//.test(type),aud=/^audio\//.test(type);
 const ios=/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
 const canShare=!!(navigator.canShare&&navigator.canShare({files:[file]}));
 const kb=blob.size>1048576?(blob.size/1048576).toFixed(1)+' MB':Math.max(1,Math.round(blob.size/1024))+' KB';
 let prev='';if(img)prev=`<img class="fv46-img" src="${bu}" alt="${esc(name)}">`;
 else if(pdf&&!ios)prev=`<iframe class="fv46-pdf" src="${bu}" title="${esc(name)}"></iframe>`;
 else if(vid)prev=`<video class="fv46-img" src="${bu}" controls playsinline></video>`;else if(aud)prev=`<audio src="${bu}" controls style="width:100%"></audio>`;
 const bar=ov.querySelector('.rep33-bar');bar.insertAdjacentHTML('beforeend',`${canShare?`<button type="button" class="btn ghost" data-f46="share">${ic('upload')}<span class="fv46-h">Guardar o compartir</span></button>`:''}<a class="btn pri" href="${bu}" download="${esc(name)}">${ic('download')}Descargar</a>`);
 ov.querySelector('.rep33-sc').innerHTML=`${prev}<div class="fv46-card">${prev?'':`<span class="fv46-ic">${ic('file')}</span>`}<div><b>${esc(name)}</b><div class="small muted">${kb}</div></div>
  <div class="fv46-acts">${canShare?`<button type="button" class="btn pri" data-f46="share">${ic('upload')}Guardar o compartir</button>`:''}<a class="btn ${canShare?'':'pri'}" href="${bu}" download="${esc(name)}">${ic('download')}Descargar</a>${pdf&&ios?`<a class="btn ghost" href="${bu}" target="_blank" rel="noopener">${ic('file')}Ver el PDF</a>`:''}</div>
  ${canShare?`<p class="small muted" style="margin:0">En el teléfono, «Guardar o compartir» te deja guardarlo en Archivos o Fotos, o enviarlo por WhatsApp o correo.</p>`:''}</div>`}
async function fileShare46(ov){const f=ov&&ov._file;if(!f)return;try{await navigator.share({files:[f],title:f.name})}catch(e){if(e&&e.name!=='AbortError')toast('No se pudo compartir. Usa «Descargar»')}}

  const cols=l.split(/\t|;|\s{3,}/).map(s=>s.trim()).filter(Boolean);let name=cols[0],sec=cur;
  const sc=cols.slice(1).find(c=>secRe.test(c))||cols.find((c,i)=>i>0&&secRe.test(c));if(sc){const mm=sc.match(secRe);sec=mm[1]+'-'+mm[2];name=cols.filter(c=>c!==sc).join(' ')}
  else if(cols.length>1&&secRe.test(cols[0])){const mm=cols[0].match(secRe);sec=mm[1]+'-'+mm[2];name=cols.slice(1).join(' ')}
  name=String(name||'').replace(/^\d+\s*[.)-]?\s+/,'').replace(/\s+/g,' ').trim();if(!name||!sec||/^nombre|^estudiante/i.test(name))return;(out[sec]=out[sec]||[]).push(name)});

  return ASIS_TPL.block.replace('{SEC}',xe54(sec)).replace('{ROWS}',rows)}).join('');
 const head=ASIS_TPL.head.replace('{TIT}',xe54(`Control asistencia ${MESES_AS[mo-1]} ${y}`)).replace('{DOC}',xe54(c.docente)).replace('{ASIG}',xe54(m.nombre));

 const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`Respaldo EduProfe+ ${hoyAS()}.json`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000);
 LSx.set(bkKey(),new Date().toISOString());logEv('Descargó un respaldo');toast('Respaldo descargado. Guárdalo en un lugar seguro');render()};
document.addEventListener('change',async e=>{if(!e.target||e.target.id!=='ep-rest')return;const f=e.target.files&&e.target.files[0];if(!f)return;try{const d=JSON.parse(await f.text());if(!d||d.app!=='EduProfe+'||!d.rows)throw 0;SEC.restore=d;render()}catch(x){toast('Ese archivo no es un respaldo de EduProfe+')}});
ACT.restore_ok=async()=>{const d=SEC.restore;if(!d)return;SEC.restore=null;let n=0;for(const [k,v] of Object.entries(d.rows)){if(k==='log')continue;ipSet(k,v,true);n++}logEv(`Restauró un respaldo (${n} registros)`);toast('Respaldo restaurado');render()};
ACT.restore_no=()=>{SEC.restore=null;render()};
// ---------- verificación en dos pasos (aplicación de autenticación) ----------
async function loadFactors(){await null;try{const {data}=await SB.auth.mfa.listFactors();SEC.factors=(data&&data.all||[]).filter(f=>f.factor_type==='totp')}catch(e){SEC.factors=[]}render()}
ACT.mfa_start=async()=>{try{for(const f of (SEC.factors||[]).filter(f=>f.status!=='verified'))await SB.auth.mfa.unenroll({factorId:f.id});
 const {data,error}=await SB.auth.mfa.enroll({factorType:'totp',friendlyName:'EduProfe+ '+Date.now().toString(36)});if(error)throw error;SEC.enroll={id:data.id,qr:data.totp.qr_code,secret:data.totp.secret};render()}
 catch(e){toast(e.message||'No se pudo iniciar la activación')}};
ACT.mfa_cancel=async()=>{const id=SEC.enroll&&SEC.enroll.id;SEC.enroll=null;if(id)try{await SB.auth.mfa.unenroll({factorId:id})}catch(e){}loadFactors()};
document.addEventListener('submit',async e=>{const f=e.target.closest('form[data-f="mfa_on"]');if(!f)return;e.preventDefault();const code=String(new FormData(f).get('code')||'').replace(/\D/g,'');
 try{const {error}=await SB.auth.mfa.challengeAndVerify({factorId:SEC.enroll.id,code});if(error){toast('Código incorrecto. Intenta con el código nuevo de la aplicación');return}
  SEC.enroll=null;logEv('Activó la verificación en dos pasos');toast('Verificación en dos pasos activada');loadFactors()}catch(x){toast('No se pudo verificar')}});
ACT.mfa_off=async d=>{if(ui.confirm!=='mfaoff'){ui.confirm='mfaoff';render();return}ui.confirm=null;try{const {error}=await SB.auth.mfa.unenroll({factorId:d.v});if(error)throw error;logEv('Desactivó la verificación en dos pasos');toast('Verificación en dos pasos desactivada');loadFactors()}catch(e){toast('Para desactivarla, sal y vuelve a entrar con tu código y luego inténtalo de nuevo')}};
// ---------- contraseña y sesiones ----------
document.addEventListener('submit',async e=>{const f=e.target.closest('form[data-f="pwchg"]');if(!f)return;e.preventDefault();const fd=new FormData(f);const p=String(fd.get('pw')||''),p2=String(fd.get('pw2')||'');
 if(p!==p2){toast('Las contraseñas no coinciden');return}if(!pwOk(p)){toast('Usa 8 caracteres o más con minúscula, mayúscula y número');return}
 const {error}=await SB.auth.updateUser({password:p});if(error){toast(/reauth|recent/i.test(error.message)?'Por seguridad, sal y vuelve a entrar antes de cambiarla':error.message);return}SEC.pw=false;logEv('Cambió su contraseña');toast('Contraseña actualizada');render()});
ACT.pw_toggle=()=>{SEC.pw=!SEC.pw;render()};
ACT.signout_all=async()=>{if(ui.confirm!=='sall'){ui.confirm='sall';render();return}ui.confirm=null;logEv('Cerró la sesión en todos los dispositivos');await new Promise(r=>setTimeout(r,800));try{await SB.auth.signOut({scope:'global'})}catch(e){}SSx.del('ep-unlocked');ui.user=null;IP.rows=null;render()};
// ---------- páginas ----------
NAVL.push(['Cuenta'],['seg','Seguridad y respaldo','shield'],['act','Actividad','clock']);
PAGE.seg=['Seguridad y respaldo','Protege tu cuenta y guarda una copia de tu información.'];PAGE.act=['Actividad','Los ingresos y cambios importantes de tu cuenta.'];
function secView(){if(SEC.factors===null){loadFactors();return head()+'<div class="card"><p class="muted" style="margin:0">Cargando…</p></div>'}
 const v=(SEC.factors||[]).find(f=>f.status==='verified');const on=bioOn(ui.user.id),nm=bioName();const dd=bkDays();
 const card=(i,t,s,act)=>`<div class="card ep-sc"><span class="ep-si">${ic(i)}</span><div class="grow"><h2>${t}</h2><p class="small muted">${s}</p></div><div class="ep-sca">${act}</div></div>`;
 let mfa;
 if(SEC.enroll)mfa=`<div class="card stack"><div class="row" style="gap:12px"><span class="ep-si">${ic('phone')}</span><h2 style="font-size:17px">Activar la verificación en dos pasos</h2></div>
  <ol class="ep-steps"><li>Instala en tu teléfono una aplicación de autenticación, por ejemplo <b>Google Authenticator</b> o <b>Microsoft Authenticator</b>.</li><li>En la aplicación toca <b>+</b> y escanea este código.</li><li>Escribe aquí el código de 6 dígitos que aparece.</li></ol>
  <div class="ep-qr"><img src="${esc(SEC.enroll.qr)}" alt="Código QR para la aplicación de autenticación"><div class="small muted">¿No puedes escanear? Escribe esta clave en la aplicación:<code>${esc(SEC.enroll.secret)}</code></div></div>
  <form data-f="mfa_on" class="row" style="gap:8px;flex-wrap:wrap"><input name="code" class="inp ep-code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" required placeholder="000000" style="max-width:180px"><button class="btn pri">${ic('check')}Activar</button><button type="button" class="btn ghost" data-a="mfa_cancel">Cancelar</button></form></div>`;
 else mfa=card('phone','Verificación en dos pasos',v?'Activada. Al entrar en un dispositivo nuevo te pediremos el código de tu aplicación de autenticación.':'Además de tu contraseña, te pediremos un código de 6 dígitos de una aplicación en tu teléfono. Es la protección más importante.',
  v?(ui.confirm==='mfaoff'?`<span class="small">¿Desactivarla?</span><button class="btn sm danger" data-a="mfa_off" data-v="${v.id}">Sí</button><button class="btn sm" data-a="cancelconfirm">No</button>`:`<span class="ep-ok">${ic('check')}Activa</span><button class="btn sm ghost" data-a="mfa_off" data-v="${v.id}">Desactivar</button>`):`<button class="btn pri" data-a="mfa_start">${ic('shield')}Activar</button>`);
 const bio=card('face',`Entrar con ${nm}`,on?`Activado en este dispositivo. Al abrir EduProfe+ o tras 15 minutos sin uso, se desbloquea con ${nm}.`:BIO_OK===false?'Este dispositivo o navegador no tiene lector de huella o rostro disponible.':'Entra más rápido y seguro en este dispositivo. Se activa una vez en cada teléfono o computadora. Tu huella o rostro nunca salen del dispositivo.',
  on?`<span class="ep-ok">${ic('check')}Activo</span><button class="btn sm ghost" data-a="biodisable">Desactivar</button>`:BIO_OK===false?'':`<button class="btn pri" data-a="bioenable">${ic('lock')}Activar</button>`);
 const pw=SEC.pw?`<div class="card stack"><div class="row" style="gap:12px"><span class="ep-si">${ic('key')}</span><h2 style="font-size:17px">Cambiar contraseña</h2></div><form data-f="pwchg" class="form" style="max-width:420px"><div class="field"><label for="np">Contraseña nueva</label><div class="ep-pw"><input id="np" name="pw" type="password" class="inp" autocomplete="new-password" required minlength="8"><button type="button" class="ep-eye" data-eye="np" aria-label="Mostrar contraseña">${ic('eye')}</button></div></div><div class="field"><label for="np2">Confírmala</label><input id="np2" name="pw2" type="password" class="inp" autocomplete="new-password" required minlength="8"><span class="small muted">Mínimo 8 caracteres con minúscula, mayúscula y número.</span></div><div class="row"><button class="btn pri">Guardar</button><button type="button" class="btn ghost" data-a="pw_toggle">Cancelar</button></div></form></div>`
  :card('key','Contraseña','Cámbiala si crees que alguien más la conoce. Usa una que no uses en otros sitios.',`<button class="btn" data-a="pw_toggle">Cambiar</button>`);
 const ses=card('logout','Sesiones abiertas','Si usaste EduProfe+ en un equipo prestado o perdiste un teléfono, cierra la sesión en todos los dispositivos.',ui.confirm==='sall'?`<span class="small">¿Cerrar en todos?</span><button class="btn sm danger" data-a="signout_all">Sí</button><button class="btn sm" data-a="cancelconfirm">No</button>`:`<button class="btn" data-a="signout_all">Cerrar en todos</button>`);
 const bk=SEC.restore?`<div class="card stack"><h2 style="font-size:17px">¿Restaurar este respaldo?</h2><p class="small muted" style="margin:0">Respaldo del ${esc(new Date(SEC.restore.fecha).toLocaleString('es-CR'))} con ${Object.keys(SEC.restore.rows).length} registros. Los grupos, materias y asistencias que tenga se van a reemplazar por los del respaldo.</p><div class="row"><button class="btn pri" data-a="restore_ok">Sí, restaurar</button><button class="btn ghost" data-a="restore_no">Cancelar</button></div></div>`
  :card('download','Respaldo de tu información',`Descarga una copia de tus grupos, habilidades, materias y asistencias. ${dd===null?'Todavía no has descargado ninguno en este dispositivo.':dd===0?'Último respaldo: hoy.':`Último respaldo: hace ${dd} día${dd===1?'':'s'}.`} Te recomendamos hacerlo cada semana.`,`<button class="btn pri" data-a="backup">${ic('download')}Descargar</button><label class="btn ghost">${ic('upload')}Restaurar<input type="file" id="ep-rest" accept="application/json,.json" hidden></label>`);
 return head()+`<div class="ep-sh">Acceso</div>${mfa}${bio}${pw}${ses}<div class="ep-sh">Tu información</div>${bk}
 <div class="card ep-note">${ic('shield')}<div><b>Así se protege EduProfe+</b><p class="small muted">Tu información viaja cifrada y se guarda en una base de datos privada: solo tu cuenta puede leerla. La página no se puede mostrar dentro de otros sitios, la sesión se bloquea tras 15 minutos sin uso y queda un registro de los ingresos en Actividad.</p></div></div>`}
function actView(){const l=ig('log',[])||[];return head()+`<div class="card">${l.length?l.map(x=>{const d=new Date(x.t);return `<div class="ep-cl"><span class="ep-si" style="margin:0">${ic(/sesi|Entr|Verific/.test(x.e)?'lock':/respaldo/i.test(x.e)?'download':/Gener|Descarg/.test(x.e)?'file':'shield')}</span><div class="grow"><b style="font-weight:600">${esc(x.e)}</b><div class="small muted">${esc(x.d||'')}</div></div><span class="small muted" style="text-align:right">${d.toLocaleDateString('es-CR',{day:'numeric',month:'short'})}<br>${d.toLocaleTimeString('es-CR',{hour:'2-digit',minute:'2-digit'})}</span></div>`}).join(''):'<p class="muted" style="margin:0">Aún no hay actividad registrada.</p>'}</div>`}
const _pvS=pageView;pageView=function(){if(IP.rows)flushLog();if(ui.view==='seg'&&IP.rows)return secView();if(ui.view==='act'&&IP.rows)return actView();
 const b=_pvS();if(ui.view==='home'&&IP.rows){const dd=bkDays();if(dd===null||dd>=7)return `<div class="ep-warn">${ic('shield')}<div class="grow">${dd===null?'Todavía no has descargado un respaldo de tu información.':`Tu último respaldo fue hace ${dd} días.`} Te recomendamos hacerlo cada semana.</div><button class="btn sm gold" data-a="backup">${ic('download')}Descargar ahora</button></div>`+b}return b};
const _navS=ACT.nav;ACT.nav=d=>{if(d.v==='seg')SEC.factors=null;_navS(d)};
// registrar documentos y controles descargados
const _genS=ACT.ip_gen;ACT.ip_gen=async(...a)=>{const r=await _genS(...a);try{logEv('Generó documentos: '+IPEC_MOM[IP.mom].lbl)}catch(e){}return r};
const _dlS=dlAS;dlAS=async list=>{const r=await _dlS(list);try{logEv('Descargó el control de asistencia de '+MESES_AS[+AS.month.split('-')[1]-1].toLowerCase())}catch(e){}return r};
// botón de bloqueo en la barra superior cuando hay biometría
const _shS=shellView;shellView=function(b){let h=_shS(b);if(bioOn(ui.user.id))h=h.replace('<button class="ep-ib" data-a="theme"','<button class="ep-ib" data-a="lock" aria-label="Bloquear" title="Bloquear">'+ic('lock')+'</button><button class="ep-ib" data-a="theme"');return h};

// ===== EduProfe+ · varias personas docentes: invitaciones, acceso y datos propios =====
var DOC={list:null,busy:false,msg:''};
ui.admin=false;ui.allowed=true;ui.nombre='';
async function loadStatus(){try{const {data,error}=await SB.rpc('ep_status');if(error)throw error;ui.allowed=data.allowed!==false;ui.admin=!!data.admin;ui.nombre=data.nombre||''}catch(e){ui.allowed=true;ui.admin=false}}
const _agD=afterGate;afterGate=async function(){await loadStatus();if(!ui.allowed){app.innerHTML=gateShell(`<div class="stack" style="align-items:center;text-align:center;gap:16px;padding-top:30px"><span class="p47-big">${ic('lock')}</span><h2 class="lg-h">Tu acceso está desactivado</h2><p class="muted" style="margin:0">Tu cuenta existe, pero por ahora no tiene acceso a EduProfe+. Si crees que es un error, consulta con la administradora.</p><button class="btn" data-a="logoutfull">Salir</button></div>`);ui._blocked=true;return}ui._blocked=false;_agD()};
const _rD=render;render=function(){if(ui.user&&ui._blocked)return;_rD()};
const _lfD=ACT.logoutfull;ACT.logoutfull=async()=>{ui._blocked=false;ui.admin=false;DOC.list=null;return _lfD()};
// datos del encabezado: cada docente con los suyos
function metaName(){try{return ui.nombre||ui.user.metaName||''}catch(e){return ''}}
cfg54=function(){return {docente:metaName(),asignatura:'',anio:new Date().getFullYear(),rec:{},...ig('cfg',{})}};
const _bootD=boot;boot=async function(){const r=await _bootD();try{const {data}=await SB.auth.getUser();if(data&&data.user&&ui.user)ui.user.metaName=(data.user.user_metadata||{}).name||''}catch(e){}if(ui.user&&!ui._blocked)render();return r};
docente=function(){try{return String(cfg54().docente||metaName()||ui.user.email||'')}catch(e){return String((ui.user&&ui.user.email)||'')}};
// aviso en el panel si faltan datos para los documentos
const _pvD=pageView;pageView=function(){if(ui.view==='doc'&&IP.rows)return docView();const b=_pvD();
 if(ui.view==='home'&&IP.rows){const c=cfg54();if(!String(c.docente||'').trim()||!String(c.asignatura||'').trim())return `<div class="ep-warn" style="background:var(--brand-soft);border-color:transparent;color:var(--fg)">${ic('gear')}<div class="grow"><b>Completa tus datos.</b> Escribe tu nombre y tu asignatura para que salgan en el encabezado de tus documentos.</div><button class="btn sm pri" data-a="nav" data-v="cfg">Completar</button></div>`+b}return b};
// ---------- página Docentes (solo administradora) ----------
PAGE.doc=['Docentes','Invita a otras personas docentes. Cada una tiene su usuario y ve solo sus propios grupos, habilidades, materias y asistencia.'];
const _shD=shellView;shellView=function(b){let h=_shD(b);if(ui.admin)h=h.replace('<div class="ep-sec">Cuenta</div>',`<div class="ep-sec">Cuenta</div><button class="${ui.view==='doc'?'on':''}" data-a="nav" data-v="doc">${ic('users')}<span>Docentes</span></button>`);return h};
async function loadDocs(){await null;try{const {data,error}=await SB.rpc('ep_doc_list');if(error)throw error;DOC.list=data||[]}catch(e){DOC.list=[];DOC.msg=e.message||'No se pudo cargar la lista'}render()}
const _navD=ACT.nav;ACT.nav=d=>{if(d.v==='doc'){DOC.list=null;DOC.msg=''}_navD(d)};
const LINK_EP=location.origin+location.pathname;
function invText(d){return `Hola${d.nombre?' '+d.nombre.split(' ')[0]:''}, te invito a EduProfe+, la app para pasar lista y generar diagnósticos, perfiles e informes con el machote del I.P.E.C.\n\n1. Entra a ${LINK_EP}\n2. Toca «Crear mi cuenta».\n3. Usa este correo: ${d.email}\n4. Confirma tu cuenta con el enlace que te llega al correo.\n\nTus grupos y tu información son privados: solo tú los ves.`}
function docView(){if(!ui.admin)return head()+'<div class="card"><p class="muted" style="margin:0">Solo la administradora puede ver esta sección.</p></div>';
 if(DOC.list===null){loadDocs();return head()+'<div class="card"><p class="muted" style="margin:0">Cargando…</p></div>'}
 const fmt=t=>t?new Date(t).toLocaleDateString('es-CR',{day:'numeric',month:'short',year:'numeric'}):'';
 const rows=DOC.list.map(d=>{const me=d.rol==='admin';const st=!d.activo?'<span class="ep-chip off">Desactivada</span>':d.cuenta?`<span class="ep-chip ok">Cuenta creada</span>`:'<span class="ep-chip wait">Invitación pendiente</span>';
  const k=esc(d.email);const conf=ui.confirm==='dd:'+d.email;
  return `<div class="ep-doc"><span class="ep-av sm ${d.activo?'':'alt'}">${esc(initials(d.nombre||d.email))}</span><div class="grow" style="min-width:0"><b>${esc(d.nombre||'Sin nombre')}${me?' <span class="small muted">(administradora)</span>':''}</b><div class="small muted ep-ell">${esc(d.email)}</div><div class="row" style="gap:6px;flex-wrap:wrap;margin-top:4px">${st}${d.ultimo?`<span class="small muted">Último ingreso: ${fmt(d.ultimo)}</span>`:''}</div></div>
   ${me?'':`<div class="ep-sca">${conf?`<span class="small">¿Quitar a ${esc(d.nombre||d.email)}?</span><button class="btn sm danger" data-a="doc_del" data-e="${k}">Sí, quitar</button><button class="btn sm" data-a="cancelconfirm">No</button>`:`${d.cuenta?'':`<button class="btn sm" data-a="doc_copy" data-e="${k}">${ic('file')}Copiar invitación</button>`}<button class="btn sm ghost" data-a="doc_set" data-e="${k}" data-v="${d.activo?'0':'1'}">${d.activo?'Desactivar':'Activar'}</button><button class="btn sm ghost" data-a="doc_ask" data-e="${k}" aria-label="Quitar">${ic('trash')}</button>`}</div>`}</div>`}).join('');
 return head()+`<div class="card stack"><h2 style="margin:0;font-size:17px">Invitar a una persona docente</h2><form data-f="doc_add" class="ep-docf"><input name="nombre" class="inp" maxlength="80" placeholder="Nombre completo" required><input name="email" class="inp" type="email" maxlength="120" placeholder="Correo electrónico" required><button class="btn pri" ${DOC.busy?'disabled':''}>${ic('userplus')}Invitar</button></form>
 <p class="small muted" style="margin:0">Después de invitarla, copia el mensaje y envíaselo por WhatsApp o correo. Solo los correos invitados pueden crear cuenta.</p></div>
 ${DOC.msg?`<div class="note">${esc(DOC.msg)}</div>`:''}<div class="card ep-docs">${rows||'<p class="muted" style="margin:0">Aún no hay docentes invitados.</p>'}</div>
 <div class="card ep-note">${ic('shield')}<div><b>La información de cada docente es privada</b><p class="small muted">Cada persona solo ve y edita sus propios grupos, habilidades, materias y asistencia. Tú tampoco ves la información de las demás. Si desactivas o quitas a alguien, deja de poder entrar de inmediato.</p></div></div>`}
document.addEventListener('submit',async e=>{const f=e.target.closest('form[data-f="doc_add"]');if(!f)return;e.preventDefault();const fd=new FormData(f);const email=String(fd.get('email')||'').trim().toLowerCase(),nombre=String(fd.get('nombre')||'').trim();
 DOC.busy=true;DOC.msg='';render();try{const {error}=await SB.rpc('ep_doc_add',{p_email:email,p_nombre:nombre});if(error)throw error;logEv('Invitó a '+email);await copyInv({email,nombre});DOC.list=null}catch(x){DOC.msg=x.message||'No se pudo invitar'}finally{DOC.busy=false;render()}});
async function copyInv(d){const t=invText(d);try{await navigator.clipboard.writeText(t);toast('Invitación copiada. Pégala en WhatsApp o en un correo')}catch(e){toast('Listo. Copia la invitación desde la lista')}}
ACT.doc_copy=d=>{const x=(DOC.list||[]).find(r=>r.email===d.e);if(x)copyInv(x)};
ACT.doc_set=async d=>{try{const {error}=await SB.rpc('ep_doc_set',{p_email:d.e,p_activo:d.v==='1'});if(error)throw error;logEv((d.v==='1'?'Activó':'Desactivó')+' a '+d.e);toast(d.v==='1'?'Acceso activado':'Acceso desactivado');DOC.list=null;render()}catch(x){toast(x.message||'No se pudo cambiar')}};
ACT.doc_ask=d=>{ui.confirm='dd:'+d.e;render()};
ACT.doc_del=async d=>{ui.confirm=null;try{const {error}=await SB.rpc('ep_doc_del',{p_email:d.e});if(error)throw error;logEv('Quitó el acceso a '+d.e);toast('Acceso quitado');DOC.list=null;render()}catch(x){toast(x.message||'No se pudo quitar')}};

ipecOn=function(){return !!ui.user};
boot();
</script>
