  <div class="row" style="justify-content:space-between;gap:8px;flex-wrap:wrap"><span class="small muted">Se guarda solo.</span>${ui.confirm==='ipd:'+g.key?`<span class="row" style="gap:6px"><span class="small">¿Eliminar ${esc(g.seccion)}?</span><button class="btn sm danger" data-a="ip_delg" data-v="${g.key}">Sí</button><button class="btn sm" data-a="cancelconfirm">No</button></span>`:`<button class="btn sm ghost" data-a="ip_askg" data-v="${g.key}">${ic('trash')}Eliminar sección</button>`}</div></div></details>`).join('')}</div>`:''}`}
ACT.ip_import=()=>{const t=document.getElementById('ip_paste');const r=parse54(t&&t.value);const secs=Object.keys(r).filter(s=>r[s].length);if(!secs.length){toast('No encontré secciones. Revisa que cada estudiante tenga su sección (ej.: 7-1)');return}
 secs.forEach(s=>{const nivel=s.split('-')[0];ipSet('grp:'+s,{nivel,seccion:s,est:[...new Set(r[s])]},true)});IP.sel=null;toast(`Listo: ${secs.length} sección${secs.length===1?'':'es'} (${secs.join(', ')})`);render()};
document.addEventListener('input',e=>{const k=e.target&&e.target.dataset&&e.target.dataset.ipgrp;if(k){const g=ig(k,null);if(!g)return;ipSet(k,{...g,est:e.target.value.split(/\r?\n/).map(s=>s.trim()).filter(Boolean)});return}
 const h=e.target&&e.target.dataset&&e.target.dataset.iphab;if(h){const [niv,list]=h.split('|');
  if(habSplit54(e.target.value,list,niv)){render();toast('Repartí las habilidades en cada nivel');return}
  const n=ig('niv:'+niv,{});ipSet('niv:'+niv,{...n,[list]:clean54(e.target.value)});return}
 const c=e.target&&e.target.dataset&&e.target.dataset.ipcfg;if(c){const cf=cfg54();if(c.startsWith('rec.'))cf.rec={...(cf.rec||{}),[c.slice(4)]:e.target.value};else cf[c]=c==='anio'?(+e.target.value||cf.anio):e.target.value;ipSet('cfg',cf)}});
ACT.ip_askg=d=>{ui.confirm='ipd:'+d.v;render()};
ACT.ip_delg=async d=>{ui.confirm=null;await ipDel(d.v);IP.sel=null;render();toast('Sección eliminada')};
function habv54(){const n=IP.niv;const nv=ig('niv:'+n,{});
 const box=(list,title,help)=>`<div class="card stack"><div><h2 style="margin:0;font-size:17px">${title}</h2><p class="small muted" style="margin:2px 0 0">${help}</p></div>
  <textarea class="inp" rows="9" data-iphab="${n}|${list}" style="resize:vertical" placeholder="Una habilidad por línea">${esc((nv[list]||[]).join('\n'))}</textarea>
  <div class="row" style="gap:8px;flex-wrap:wrap;align-items:center"><label class="btn sm" style="cursor:pointer;position:relative;overflow:hidden">${ic('image')}${IP.ai===n+'|'+list?'Leyendo la foto…':'Foto de contenidos → habilidades'}<input type="file" accept="image/*" data-ipai="${n}|${list}" style="position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer;font-size:0" ${IP.ai?'disabled':''}></label>
   <span class="small muted">${(nv[list]||[]).length} habilidades · se guarda solo</span></div></div>`;
 return `<nav class="qtabs" style="margin-bottom:12px">${Object.keys(NIV54).map(k=>`<button class="${n===k?'on':''}" data-a="ip_niv" data-v="${k}">${k}.°</button>`).join('')}</nav>
 <p class="small muted" style="margin:0 0 12px"><b>${NIV54[n]}</b>. Una habilidad por línea. Si pegas el archivo completo con todos los niveles, el campus reparte cada lista en su nivel.</p>
 ${box('diag','Diagnóstico','Conocimientos previos que evalúas al inicio del año (normalmente, contenidos del año anterior).')}
 ${box('curso','Habilidades del curso','Se usan en el Perfil de entrada y el I Informe (en EP), y en el II Informe y el Perfil de salida (en L).')}`}
ACT.ip_niv=d=>{IP.niv=d.v;render()};
async function img54(file){const bmp=await createImageBitmap(file);const s=Math.min(1,1600/Math.max(bmp.width,bmp.height));const c=document.createElement('canvas');c.width=Math.round(bmp.width*s);c.height=Math.round(bmp.height*s);c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);return c.toDataURL('image/jpeg',0.85).split(',')[1]}
document.addEventListener('change',async e=>{const k=e.target&&e.target.dataset&&e.target.dataset.ipai;if(!k||!e.target.files[0])return;const [niv,list]=k.split('|');IP.ai=k;render();
 try{const img=await img54(e.target.files[0]);const {data,error}=await SB.functions.invoke('ipec-ia',{body:{img,mime:'image/jpeg',nivel:NIV54[niv],para:list}});
  let msg=null;if(error){try{const j=await error.context.json();msg=j&&j.error}catch(x){}msg=msg||'No se pudo leer la foto'}else if(data&&data.error)msg=data.error;
  if(msg){toast(msg);return}const hab=(data&&data.hab)||[];if(!hab.length){toast('No encontré contenidos en la foto');return}
  const n=ig('niv:'+niv,{});const prev=n[list]||[];ipSet('niv:'+niv,{...n,[list]:prev.length?prev.concat(hab.filter(h=>!prev.includes(h))):hab},true);toast(`Agregué ${hab.length} habilidades. Revísalas y corrígelas si hace falta`)}
 catch(x){toast('No se pudo leer la foto')}finally{IP.ai=null;render()}});
function cfgv54(){const c=cfg54();return `<div class="card stack"><h2 style="margin:0;font-size:17px">Datos del encabezado</h2><div class="form">
 <div class="field"><label for="ipc1">Persona docente</label><input id="ipc1" class="inp" data-ipcfg="docente" value="${esc(c.docente)}"></div>
 <div class="two"><div class="field"><label for="ipc2">Asignatura</label><input id="ipc2" class="inp" data-ipcfg="asignatura" value="${esc(c.asignatura)}"></div>
 <div class="field"><label for="ipc3">Año</label><input id="ipc3" class="inp" type="number" data-ipcfg="anio" value="${esc(c.anio)}"></div></div></div></div>
 <div class="card stack"><div><h2 style="margin:0;font-size:17px">Recomendaciones / Observaciones</h2><p class="small muted" style="margin:2px 0 0">Este texto sale en cada estudiante. Cámbialo cuando quieras.</p></div>
 ${Object.entries(IPEC_MOM).map(([k,m])=>`<div class="field"><label for="ipr_${k}">${m.lbl}</label><textarea id="ipr_${k}" class="inp" rows="3" data-ipcfg="rec.${k}" style="resize:vertical">${esc((c.rec||{})[k]||REC54[k])}</textarea></div>`).join('')}</div>`}

(function(){const st=document.createElement('style');st.textContent=`.ip-moms{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px}
.ip-mom{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px;cursor:pointer;font:inherit;color:var(--fg)}
.ip-mom span{font-size:12px;color:var(--muted)}.ip-mom.on{border-color:var(--brand,#336FA8);background:var(--brand-soft,#E4EFF7);box-shadow:0 0 0 1px var(--brand,#336FA8) inset}
.ip-niv{border-top:1px solid var(--line);padding-top:10px;display:flex;flex-direction:column;gap:8px}.ip-niv:first-of-type{border-top:0}
.ip-secs{display:flex;flex-wrap:wrap;gap:8px}.ip-warn{color:#B42318;font-weight:600}
.ip-g summary{cursor:pointer;list-style:none}.ip-g summary::-webkit-details-marker{display:none}`;document.head.appendChild(st)})();
